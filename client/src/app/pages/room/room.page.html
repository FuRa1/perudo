<ion-header>
  <ion-toolbar>
    <ion-title>Room {{ store.view()?.roomId }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="handleLeave()">Leave</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (store.view(); as view) {
    @switch (view.phase) {
      @case (GamePhase.LOBBY) {
        <app-lobby />
      }
      @case (GamePhase.START_ROLL) {
        <app-start-roll />
      }
      @case (GamePhase.GAME_OVER) {
        <app-game-over />
      }
      @default {
        <app-table />
      }
    }
  }

  <ion-toast
    [isOpen]="!!store.error()"
    [message]="store.error()?.message"
    color="danger"
    position="top"
    [duration]="3000"
    (didDismiss)="store.clearError()"
  />
</ion-content>
