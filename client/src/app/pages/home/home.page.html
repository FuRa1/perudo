<ion-header>
  <ion-toolbar>
    <ion-title>Perudo · Pirates' Dice</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="mx-auto flex max-w-md flex-col gap-6 pt-6">
    <div class="text-center">
      <div class="text-6xl" aria-hidden="true">🏴‍☠️</div>
      <h1 class="mt-2 text-2xl font-bold">Liar's Dice on the high seas</h1>
      <p class="opacity-75">2–12 pirates · each on their own device</p>
    </div>

    <ion-list inset>
      <ion-item>
        <ion-input
          label="Your pirate name"
          labelPlacement="stacked"
          [maxlength]="limits.nicknameMaxLength"
          placeholder="Captain Jack"
          [(ngModel)]="nickname"
        />
      </ion-item>
    </ion-list>

    <ion-button
      expand="block"
      [disabled]="!hasNickname() || store.isBusy()"
      (click)="handleCreate()"
    >
      Create a new room
    </ion-button>

    <div class="text-center opacity-60">— or join a crew —</div>

    <ion-list inset>
      <ion-item>
        <ion-input
          label="Room code"
          labelPlacement="stacked"
          [maxlength]="limits.codeLength"
          placeholder="ABCDE"
          class="uppercase"
          [(ngModel)]="roomCode"
        />
      </ion-item>
    </ion-list>
    <ion-button
      expand="block"
      fill="outline"
      [disabled]="!hasNickname() || !hasRoomCode() || store.isBusy()"
      (click)="handleJoin()"
    >
      Join room
    </ion-button>

    @if (store.error(); as error) {
      <ion-note color="danger" class="text-center">{{ error.message }}</ion-note>
    }
  </div>
</ion-content>
