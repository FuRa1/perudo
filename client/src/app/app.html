@if (!store.playerId()) {
  <app-entry />
} @else if (store.isGameOver()) {
  <app-winner />
} @else if (store.isLobby()) {
  <app-lobby />
} @else {
  <app-table />
}

@if (store.lastError(); as error) {
  <div class="fixed bottom-2 left-2 right-2 rounded bg-red-600 p-2 text-center text-white">
    {{ error.code }}: {{ error.message }}
  </div>
}
