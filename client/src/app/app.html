@if (!store.playerId()) {
  <app-entry />
} @else if (store.isGameOver()) {
  <app-winner />
} @else if (store.isLobby()) {
  <app-lobby />
} @else {
  <app-table />
}

@if (store.lastError(); as error) {
  <div
    class="rounded-tile fixed right-2 bottom-2 left-2 border border-ember bg-danger p-2 text-center text-ivory shadow-float"
  >
    {{ error.code }}: {{ error.message }}
  </div>
}
