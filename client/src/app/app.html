@if (!store.playerId()) {
  <app-entry />
} @else if (store.isGameOver()) {
  <app-winner />
} @else if (store.isLobby()) {
  <app-lobby />
} @else {
  <app-game-board />
}

@if (store.lastError(); as error) {
  <div class="app-error-toast fixed right-2 bottom-2 left-2 p-2 text-center">
    {{ error.code }}: {{ error.message }}
  </div>
}
