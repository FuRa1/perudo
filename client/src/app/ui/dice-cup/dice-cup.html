@if (isOwner()) {
  <div
    #ownerCupEl
    class="relative dice-cup-owner-shell"
    [style.width.px]="ownerSizePx()"
    [style.height.px]="ownerSizePx()"
  >
    <div class="absolute inset-0 rounded-full" [class]="cssClass.openExterior">
      <div
        class="absolute overflow-hidden rounded-full"
        [class]="cssClass.openInterior"
        [style.inset]="innerBowlInset()"
      >
        @if (dieViews().length === 0) {
          <!-- Empty/ready state (before the hand roll): the bowl is genuinely empty, not just
               visually blank, so it needs its own affordance — a dashed ring echoing the
               opening-roll panel's waiting placeholder, plus a short label naming the state. -->
          <div class="dice-cup-owner-empty absolute inset-0 flex items-center justify-center">
            <div class="dice-cup-owner-empty__ring flex items-center justify-center rounded-full">
              <span class="dice-cup-owner-empty__label text-center text-xs font-semibold"
                >Ready</span
              >
            </div>
          </div>
        }
        @for (view of dieViews(); track $index) {
          <div
            class="absolute top-1/2 left-1/2"
            [style.width.px]="dieSizePx"
            [style.height.px]="dieSizePx"
            [style.transform]="view.transform"
          >
            <app-die [value]="view.face" />
          </div>
        }
      </div>
    </div>
  </div>
} @else {
  <div
    class="relative flex items-center justify-center rounded-t-full"
    [class]="cssClass.closed"
    [style.width.px]="cupSizePx() * 0.78"
    [style.height.px]="cupSizePx() * 0.62"
  >
    <span class="dice-cup-closed__count text-xs font-semibold">{{ diceCount() }}</span>
  </div>
}
