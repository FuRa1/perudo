@if (isOwner()) {
  <div #ownerCupEl class="relative dice-cup-owner-shell">
    <div class="absolute inset-0 rounded-full" [class]="cssClass.openExterior">
      <div
        class="absolute overflow-hidden rounded-full"
        [class]="cssClass.openInterior"
        [style.inset]="innerBowlInset()"
      >
        @for (view of dieViews(); track $index) {
          <div
            class="absolute top-1/2 left-1/2"
            [style.width.px]="dieSizePx"
            [style.height.px]="dieSizePx"
            [style.transform]="view.transform"
          >
            <app-die [value]="view.face" />
          </div>
        }
      </div>
    </div>
  </div>
} @else {
  <div
    class="relative flex items-center justify-center rounded-t-full"
    [class]="cssClass.closed"
    [style.width.px]="cupSizePx() * 0.78"
    [style.height.px]="cupSizePx() * 0.62"
  >
    <span class="text-xs font-semibold text-cream">{{ diceCount() }}</span>
  </div>
}
