<button
  type="button"
  class="bid-suggestion flex min-h-11 items-center gap-2 px-3 py-2 text-sm font-semibold"
  [disabled]="isUnavailable()"
  [attr.aria-label]="
    bid()
      ? label() + ', ' + bid()!.quantity + ' of face ' + diceValueOf(bid()!)
      : label() + ', unavailable'
  "
  (click)="onClick()"
>
  <span>{{ displayLabel() }}:</span>
  @if (bid(); as b) {
    <span class="tabular-nums">{{ b.quantity }} ×</span>
    <span [style.width.px]="dieSizePx"><app-die [value]="diceValueOf(b)" /></span>
  } @else {
    <span class="italic">n/a</span>
  }
</button>
