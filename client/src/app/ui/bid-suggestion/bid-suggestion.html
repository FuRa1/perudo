<button
  type="button"
  class="rounded-tile flex items-center gap-2 border border-border-onboard bg-fill-onboard px-2 py-1 text-sm font-semibold text-cream transition hover:border-brass hover:bg-fill-onboard-hover focus-visible:ring-2 focus-visible:ring-focus focus-visible:ring-offset-1 focus-visible:outline-none disabled:cursor-not-allowed disabled:border-border-onboard disabled:bg-transparent disabled:text-cream-faint disabled:hover:border-border-onboard disabled:hover:bg-transparent"
  [disabled]="isUnavailable()"
  [attr.aria-label]="
    bid()
      ? label() + ', ' + bid()!.quantity + ' of face ' + diceValueOf(bid()!)
      : label() + ', unavailable'
  "
  (click)="onClick()"
>
  <span>{{ label() }}:</span>
  @if (bid(); as b) {
    <span class="tabular-nums">{{ b.quantity }} ×</span>
    <span [style.width.px]="dieSizePx"><app-die [value]="diceValueOf(b)" /></span>
  } @else {
    <span class="italic">unavailable</span>
  }
</button>
