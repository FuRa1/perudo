<!-- Horizontal steppers ([−] 3 [+]  ×  [‹] die [›]): one row instead of the old stacked
     ▲/value/▼ columns, which made the bid tray ~200px tall and squeezed the opponents' arc to a
     sliver on shorter phones (Pixel 2, 2026-11-04 playtest). -->
<div class="bid-picker flex items-center justify-center gap-3">
  <div class="bid-picker__group flex items-center gap-1.5" role="group" aria-label="Bid quantity">
    <button
      type="button"
      class="bid-picker__button flex h-11 w-11 items-center justify-center"
      [disabled]="!canDecrementQuantity()"
      aria-label="Decrease quantity"
      (click)="decrementQuantity()"
    >
      −
    </button>

    <div
      class="bid-picker__value bid-picker__value--quantity flex items-center justify-center tabular-nums select-none"
      role="spinbutton"
      [attr.tabindex]="disabled() ? -1 : 0"
      [attr.aria-valuenow]="quantity()"
      aria-valuemin="1"
      [attr.aria-label]="'Bid quantity, ' + quantity()"
      (wheel)="onQuantityWheel($event)"
      (keydown)="onQuantityKeydown($event)"
    >
      {{ quantity() }}
    </div>

    <button
      type="button"
      class="bid-picker__button flex h-11 w-11 items-center justify-center"
      [disabled]="disabled()"
      aria-label="Increase quantity"
      (click)="incrementQuantity()"
    >
      +
    </button>
  </div>

  <span class="bid-picker__separator text-[20px] font-bold" aria-hidden="true">×</span>

  <div
    class="bid-picker__group flex items-center gap-1.5"
    [class.bid-picker__group--locked]="!canChangeFace()"
    role="group"
    aria-label="Bid face"
  >
    <button
      type="button"
      class="bid-picker__button flex h-11 w-11 items-center justify-center"
      [disabled]="!canChangeFace()"
      aria-label="Previous face"
      (click)="decrementFace()"
    >
      ‹
    </button>

    <div
      class="bid-picker__value"
      [style.width.px]="dieSizePx"
      role="spinbutton"
      [attr.tabindex]="canChangeFace() ? 0 : -1"
      [attr.aria-valuenow]="face()"
      aria-valuemin="1"
      aria-valuemax="6"
      [attr.aria-label]="face() === 1 ? 'Bid face, ace, wild' : 'Bid face, ' + face()"
      (wheel)="onFaceWheel($event)"
      (keydown)="onFaceKeydown($event)"
    >
      <app-die [value]="face()" />
    </div>

    <button
      type="button"
      class="bid-picker__button flex h-11 w-11 items-center justify-center"
      [disabled]="!canChangeFace()"
      aria-label="Next face"
      (click)="incrementFace()"
    >
      ›
    </button>
  </div>
</div>
