<div
  class="rounded-panel inline-flex items-stretch gap-3 border border-border-onboard bg-fill-onboard p-2"
>
  <!-- Quantity stepper -->
  <div class="flex flex-col items-center gap-1" role="group" aria-label="Bid quantity">
    <button
      type="button"
      class="flex h-6 w-8 items-center justify-center rounded border border-border-onboard-strong bg-fill-onboard-strong leading-none text-cream transition hover:bg-fill-onboard-hover focus-visible:ring-2 focus-visible:ring-focus focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="disabled()"
      aria-label="Increase quantity"
      (click)="incrementQuantity()"
    >
      ▲
    </button>

    <div
      class="w-10 text-center text-xl font-bold tabular-nums text-cream select-none focus-visible:ring-2 focus-visible:ring-focus focus-visible:outline-none"
      role="spinbutton"
      [attr.tabindex]="disabled() ? -1 : 0"
      [attr.aria-valuenow]="quantity()"
      aria-valuemin="1"
      [attr.aria-label]="'Bid quantity, ' + quantity()"
      (wheel)="onQuantityWheel($event)"
      (keydown)="onQuantityKeydown($event)"
    >
      {{ quantity() }}
    </div>

    <button
      type="button"
      class="flex h-6 w-8 items-center justify-center rounded border border-border-onboard-strong bg-fill-onboard-strong leading-none text-cream transition hover:bg-fill-onboard-hover focus-visible:ring-2 focus-visible:ring-focus focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="!canDecrementQuantity()"
      aria-label="Decrease quantity"
      (click)="decrementQuantity()"
    >
      ▼
    </button>
  </div>

  <span class="self-center text-2xl font-bold text-cream-muted" aria-hidden="true">×</span>

  <!-- Face stepper -->
  <div class="flex flex-col items-center gap-1" role="group" aria-label="Bid face">
    <button
      type="button"
      class="flex h-6 w-8 items-center justify-center rounded border border-border-onboard-strong bg-fill-onboard-strong leading-none text-cream transition hover:bg-fill-onboard-hover focus-visible:ring-2 focus-visible:ring-focus focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="!canChangeFace()"
      aria-label="Next face"
      (click)="incrementFace()"
    >
      ▲
    </button>

    <div
      class="focus-visible:ring-2 focus-visible:ring-focus focus-visible:outline-none"
      [style.width.px]="dieSizePx"
      role="spinbutton"
      [attr.tabindex]="canChangeFace() ? 0 : -1"
      [attr.aria-valuenow]="face()"
      aria-valuemin="1"
      aria-valuemax="6"
      [attr.aria-label]="face() === 1 ? 'Bid face, ace, wild' : 'Bid face, ' + face()"
      (wheel)="onFaceWheel($event)"
      (keydown)="onFaceKeydown($event)"
    >
      <app-die [value]="face()" />
    </div>

    <button
      type="button"
      class="flex h-6 w-8 items-center justify-center rounded border border-border-onboard-strong bg-fill-onboard-strong leading-none text-cream transition hover:bg-fill-onboard-hover focus-visible:ring-2 focus-visible:ring-focus focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-40"
      [disabled]="!canChangeFace()"
      aria-label="Previous face"
      (click)="decrementFace()"
    >
      ▼
    </button>
  </div>
</div>
