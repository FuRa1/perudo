<div class="bid-picker inline-flex items-stretch gap-4 p-3">
  <!-- Quantity stepper -->
  <div class="flex flex-col items-center gap-2" role="group" aria-label="Bid quantity">
    <button
      type="button"
      class="bid-picker__button flex h-11 w-14 items-center justify-center rounded-xl text-base leading-none"
      [disabled]="disabled()"
      aria-label="Increase quantity"
      (click)="incrementQuantity()"
    >
      ▲
    </button>

    <div
      class="bid-picker__value w-14 text-center text-4xl font-bold tabular-nums select-none"
      role="spinbutton"
      [attr.tabindex]="disabled() ? -1 : 0"
      [attr.aria-valuenow]="quantity()"
      aria-valuemin="1"
      [attr.aria-label]="'Bid quantity, ' + quantity()"
      (wheel)="onQuantityWheel($event)"
      (keydown)="onQuantityKeydown($event)"
    >
      {{ quantity() }}
    </div>

    <button
      type="button"
      class="bid-picker__button flex h-11 w-14 items-center justify-center rounded-xl text-base leading-none"
      [disabled]="!canDecrementQuantity()"
      aria-label="Decrease quantity"
      (click)="decrementQuantity()"
    >
      ▼
    </button>
  </div>

  <span class="bid-picker__separator self-center text-3xl font-bold" aria-hidden="true">×</span>

  <!-- Face stepper -->
  <div class="flex flex-col items-center gap-2" role="group" aria-label="Bid face">
    <button
      type="button"
      class="bid-picker__button flex h-11 w-14 items-center justify-center rounded-xl text-base leading-none"
      [disabled]="!canChangeFace()"
      aria-label="Next face"
      (click)="incrementFace()"
    >
      ▲
    </button>

    <div
      class="bid-picker__value"
      [style.width.px]="dieSizePx"
      role="spinbutton"
      [attr.tabindex]="canChangeFace() ? 0 : -1"
      [attr.aria-valuenow]="face()"
      aria-valuemin="1"
      aria-valuemax="6"
      [attr.aria-label]="face() === 1 ? 'Bid face, ace, wild' : 'Bid face, ' + face()"
      (wheel)="onFaceWheel($event)"
      (keydown)="onFaceKeydown($event)"
    >
      <app-die [value]="face()" />
    </div>

    <button
      type="button"
      class="bid-picker__button flex h-11 w-14 items-center justify-center rounded-xl text-base leading-none"
      [disabled]="!canChangeFace()"
      aria-label="Previous face"
      (click)="decrementFace()"
    >
      ▼
    </button>
  </div>
</div>
