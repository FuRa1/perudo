<div
  class="seat-card flex flex-col items-center gap-1 p-2 transition-all"
  [class.seat-card--active]="isCurrentBidder()"
  [class.w-fit]="isMe()"
  [style.min-width.px]="isMe() ? minMyCardWidthPx : null"
  [style.width.px]="isMe() ? null : size() === 'large' ? 140 : size() === 'medium' ? 104 : 76"
>
  <div
    class="seat-card__name flex items-center gap-1 text-center text-sm font-semibold whitespace-nowrap"
  >
    @if (isMe()) {
      <svg lucideCircleUserRound class="seat-card__icon" aria-hidden="true"></svg>
    }
    <span class="truncate">{{ player().nickname }}</span>
  </div>

  @if (currentBid(); as bid) {
    <app-bid-marker [bid]="bid" />
  }

  <div class="flex justify-center">
    <app-dice-cup
      [dice]="isMe() ? player().dice : null"
      [diceCount]="player().diceCount"
      [isOwner]="isMe()"
      [size]="size()"
    />
  </div>

  <div class="flex flex-wrap justify-center gap-1">
    @if (isCurrentBidder()) {
      <ion-badge color="primary">Bidding</ion-badge>
    }
    @if (handRollStatus() === 'rolled') {
      <ion-badge color="success">Hand rolled</ion-badge>
    } @else if (handRollStatus() === 'waiting') {
      <ion-badge color="medium">Waiting to roll</ion-badge>
    }
    @if (player().diceCount === 0) {
      <ion-badge color="medium">Out</ion-badge>
    }
  </div>
</div>
