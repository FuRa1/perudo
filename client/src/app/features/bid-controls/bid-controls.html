<div class="ion-padding-horizontal flex flex-col items-center gap-3">
  @if (isMyTurn()) {
    <app-bid-picker
      [quantity]="quantity()"
      [face]="displayedFace()"
      [faceDisabled]="isFaceLocked()"
      (quantityChange)="onQuantityChange($event)"
      (faceChange)="onFaceChange($event)"
    />

    @if (!isValid()) {
      <p class="bid-controls__invalid text-sm">Not a legal raise.</p>
    }

    <div
      class="bid-controls__suggestions flex flex-nowrap gap-2 overflow-x-auto pb-1 md:flex-wrap md:justify-center md:overflow-visible md:pb-0"
    >
      <app-bid-suggestion
        label="Minimum"
        [bid]="minimumSuggestion()"
        (bidSelected)="applySuggestion($event)"
      />
      <app-bid-suggestion
        label="Switch to aces"
        [bid]="aceSwitchSuggestion()"
        (bidSelected)="applySuggestion($event)"
      />
      <app-bid-suggestion
        label="Switch to a face"
        [bid]="normalSwitchSuggestion()"
        (bidSelected)="applySuggestion($event)"
      />
    </div>

    <div class="bid-controls__actions flex flex-wrap justify-center gap-2 md:flex-row">
      <ion-button
        class="bid-controls__place-btn"
        color="primary"
        [disabled]="!isValid()"
        (click)="placeBid()"
      >
        Place bid
      </ion-button>
      <ion-button
        class="bid-controls__liar-btn"
        color="danger"
        [disabled]="!canCallLiar()"
        (click)="callLiar()"
      >
        <svg lucideHand slot="start" aria-hidden="true"></svg>
        Call liar!
      </ion-button>
    </div>
  } @else {
    <p class="bid-controls__waiting px-3 py-2 text-sm">
      Waiting for {{ currentPlayerName() ?? 'the next player' }} to bid
    </p>
  }

  @if (canDeclareSpecialRound()) {
    <ion-button color="warning" (click)="declareSpecialRound()">Declare special round</ion-button>
  }
</div>
