<ion-modal
  #modalEl
  class="round-loss-modal"
  [isOpen]="isOpen()"
  (didDismiss)="close()"
  [style.--backdrop-opacity]="1"
  [style.--background]="'transparent'"
  [style.--box-shadow]="'none'"
>
  <ng-template>
    <div class="flex h-full flex-col items-center justify-center">
      <div class="round-loss-card flex flex-col items-center gap-3 text-center">
        @if (badgeImageUrl; as imageUrl) {
          <img [src]="imageUrl" alt="" aria-hidden="true" class="round-loss-badge-image" />
        } @else {
          <div class="round-loss-badge" aria-hidden="true"></div>
        }
        <h2 class="round-loss__title font-heading text-lg">Time ran out</h2>

        <span class="round-loss__verdict text-xs font-semibold uppercase tracking-wide">
          Turn timed out
        </span>

        <p class="round-loss__body text-sm">
          You didn't bid or call liar before your time ran out, so the round ended without you.
        </p>

        <p class="round-loss__final text-sm font-semibold">{{ lossSummary() }}</p>

        <ion-button class="round-loss__action" expand="block" (click)="close()">Close</ion-button>
      </div>
    </div>
  </ng-template>
</ion-modal>
