<ion-modal [isOpen]="isOpen()" (didDismiss)="close()">
  <ng-template>
    <div class="ion-padding flex flex-col items-center gap-3 bg-parchment text-center">
      <h2 class="text-lg font-bold text-ink">You lost this round</h2>

      @if (lostBecauseBidWasTrue()) {
        <p class="text-sm text-ink">You called liar, but the bid was true.</p>
      } @else {
        <p class="text-sm text-ink">Your bid was false.</p>
      }

      @if (claimedBid(); as bid) {
        <div class="flex flex-col items-center gap-1">
          <span class="text-xs text-wood">Claimed</span>
          <app-bid-marker [bid]="bid" />
        </div>
      }

      <p class="text-sm text-ink">Actual count: {{ actualQuantity() }}</p>
      <p class="text-sm font-semibold text-ink">You lost one die.</p>

      <ion-button (click)="close()">Close</ion-button>
    </div>
  </ng-template>
</ion-modal>
