<ion-modal
  #modalEl
  class="round-loss-modal"
  [isOpen]="isOpen()"
  (didDismiss)="close()"
  [style.--backdrop-opacity]="0.72"
  [style.--background]="'transparent'"
  [style.--box-shadow]="'none'"
>
  <ng-template>
    <div class="flex h-full flex-col items-center justify-center">
      <div class="round-loss-card flex flex-col items-center gap-3 text-center">
        @if (badgeImageUrl; as imageUrl) {
          <img [src]="imageUrl" alt="" aria-hidden="true" class="round-loss-badge-image" />
        } @else {
          <div class="round-loss-badge" aria-hidden="true"></div>
        }
        <h2 class="round-loss__title font-heading text-lg">You lost this round</h2>

        @if (lostBecauseBidWasTrue()) {
          <p class="round-loss__body text-sm">You called liar, but the bid was true.</p>
        } @else {
          <p class="round-loss__body text-sm">Your bid was false.</p>
        }

        @if (claimedBid(); as bid) {
          <div class="flex flex-col items-center gap-1">
            <span class="round-loss__claimed-label text-xs">Claimed</span>
            <app-bid-marker [bid]="bid" />
          </div>
        }

        <p class="round-loss__body text-sm">Actual count: {{ actualQuantity() }}</p>
        <p class="round-loss__final text-sm font-semibold">{{ lossSummary() }}</p>

        <ion-button (click)="close()">Close</ion-button>
      </div>
    </div>
  </ng-template>
</ion-modal>
