<ion-content>
  <h2 class="lobby__title font-heading text-xl mb-1">Lobby</h2>
  <p class="lobby__room-code mb-3 inline-block px-3 py-2">
    Room code: <strong class="tracking-widest">{{ roomId() }}</strong> — share it with your friends
    so they can join.
  </p>
  <ion-list>
    @for (player of players(); track player.id) {
      <ion-item>
        {{ player.nickname }}
        <ion-badge slot="end" [color]="player.isReady ? 'success' : 'medium'">
          {{ player.isReady ? 'Ready' : 'Not ready' }}
        </ion-badge>
      </ion-item>
    }
  </ion-list>
  <ion-button expand="block" class="ion-margin-top" (click)="toggleReady()">
    <svg lucideCheck slot="start" aria-hidden="true"></svg>
    {{ me()?.isReady ? 'Cancel ready' : "I'm ready" }}
  </ion-button>
</ion-content>
